# arkai CI: gates the voice-spine invariants on every push and pull request.
# The same three gates run locally via the pre-commit hook in ops/ci/, so a
# green commit locally should mean a green run here. The toolchain comes from
# rust-toolchain.toml rather than from this file, so the two can never drift.
name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: macos-latest # flock/launchd-adjacent code paths target macOS; keep CI on the same OS
    steps:
      - uses: actions/checkout@v4
      # No toolchain version here on purpose. With no arguments this installs
      # exactly what rust-toolchain.toml pins, components included, so the
      # version is reviewed in one place instead of being whatever `stable`
      # resolved to on the day the workflow ran.
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg (ffprobe is a hard runtime dep of the watcher tests)
        run: brew install ffmpeg
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (queue-gate invariants, lock, notifier, local route, multi-source)
        run: cargo test
